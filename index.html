<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Q-System ระบบจองคิวอัจฉริยะ (Pro Max)</title>

  <!-- 📌 เพิ่มโค้ดบรรทัดนี้ลงไป เพื่อเปลี่ยนโลโก้บนแท็บเบราว์เซอร์ -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2913/2913076.png">
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
          animation: { 
            'fade-in': 'fadeIn 0.4s ease-out forwards',
            'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-slow': 'bounce 2s infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <!-- Firebase v10 Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); color: #1e293b; min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); }
    .btn-scale:active { transform: scale(0.97); }
    .text-glow { text-shadow: 0 0 20px rgba(253, 224, 71, 0.5); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. Firebase Initialization
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyB1vBRTD1namUalMXFB7cPhWwdZFONZ-yI",
      authDomain: "q-dee-v-1.firebaseapp.com",
      projectId: "q-dee-v-1",
      storageBucket: "q-dee-v-1.firebasestorage.app",
      messagingSenderId: "735028566995",
      appId: "1:735028566995:web:ee102df3aa20dc69042d26",
      measurementId: "G-LX6G6VEWQW"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // 2. Components
    // ==========================================

    /* 📱 2.1 หน้าลูกค้า (Kiosk & Tracking) */
    const CustomerView = ({ displayStatus, allWaitingTickets }) => {
      const [step, setStep] = useState(1);
      const [categories, setCategories] = useState([]);
      const [selectedCat, setSelectedCat] = useState(null);
      const [name, setName] = useState("");
      const [loading, setLoading] = useState(false);
      const [myTicketId, setMyTicketId] = useState(null);
      const [myTicketData, setMyTicketData] = useState(null);
      const [showAlert, setShowAlert] = useState(false);
      
      // 📌 ตัวแปรอ้างอิงเพื่อเก็บเวลาเรียกคิวล่าสุด ใช้สำหรับตรวจจับการ "เรียกซ้ำ"
      const prevCalledAt = useRef(0);

      useEffect(() => {
        return db.collection('categories').onSnapshot(snapshot => {
          setCategories(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
      }, []);

      useEffect(() => {
        if (!myTicketId) return;
        return db.collection('tickets').doc(myTicketId).onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data();
            setMyTicketData(data);
            if (data.status === 'called') {
              // 📌 ตรวจจับว่าเวลา calledAt ถูกอัปเดตใหม่หรือไม่ (แสดงว่าโดนกด "เรียกซ้ำ")
              if (data.calledAt > prevCalledAt.current) {
                setShowAlert(true);
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                prevCalledAt.current = data.calledAt;
              }
            }
          }
        });
      }, [myTicketId]);

      const handleSelectCategory = (cat) => {
        setSelectedCat(cat);
        setStep(2);
      };

      const handleReserve = async (e) => {
        e.preventDefault();
        if (!name.trim()) return alert("กรุณาระบุชื่อของคุณ");
        setLoading(true);

        try {
          const snapshot = await db.collection('tickets').where('category', '==', selectedCat.id).get();
          let maxInt = 0;
          snapshot.forEach(doc => {
            const data = doc.data();
            if (data.queueNumberInt > maxInt) maxInt = data.queueNumberInt;
          });
          
          const newInt = maxInt + 1;
          const qString = selectedCat.id + ("000" + newInt).slice(-3);
          const createdAt = Date.now();

          const docRef = await db.collection('tickets').add({
            name: name.trim(),
            category: selectedCat.id,
            categoryName: selectedCat.name,
            queueNumberInt: newInt,
            queueString: qString,
            status: "waiting",
            createdAt: createdAt,
            calledAt: 0
          });

          setMyTicketId(docRef.id);
          setName("");
          setStep(3);
        } catch (error) {
          alert("เกิดข้อผิดพลาดในการจองคิว โปรดตรวจสอบ Rules ใน Firebase");
        } finally {
          setLoading(false);
        }
      };

      let queuesAhead = 0;
      if (myTicketData && selectedCat) {
        queuesAhead = allWaitingTickets.filter(t => t.category === selectedCat.id && t.createdAt < myTicketData.createdAt).length;
      }

      const formatTime = (timestamp) => {
        if (!timestamp) return "";
        const date = new Date(timestamp);
        return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
      };

      const formatDate = (timestamp) => {
        if (!timestamp) return "";
        const date = new Date(timestamp);
        return date.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      };

      return (
        <div className="animate-fade-in w-full max-w-md mx-auto pt-4 md:pt-10 pb-10">
          <div className="glass-card p-6 sm:p-10 rounded-[2rem] text-center relative">
            {step === 1 && (
              <div className="animate-fade-in">
                <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="material-icons-round text-3xl">touch_app</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">ยินดีต้อนรับ</h1>
                <p className="text-slate-500 mb-8 font-light text-sm sm:text-base">กรุณาเลือกบริการที่ต้องการ</p>
                {categories.length === 0 ? (
                  <p className="text-slate-400 py-6">ยังไม่มีหมวดหมู่บริการในระบบ</p>
                ) : (
                  <div className="space-y-4">
                    {categories.map(cat => {
                      const isOpen = cat.isOpen !== false;
                      return (
                        <button 
                          key={cat.id} 
                          onClick={() => isOpen && handleSelectCategory(cat)} 
                          disabled={!isOpen}
                          className={`btn-scale w-full bg-gradient-to-r ${cat.style || 'from-indigo-500 to-blue-600'} text-white text-lg sm:text-xl font-semibold py-4 sm:py-5 rounded-2xl flex items-center justify-between px-4 sm:px-6 shadow-lg ${!isOpen ? 'opacity-50 grayscale cursor-not-allowed' : ''}`}
                        >
                          <div className="flex items-center gap-3 sm:gap-4">
                            <span className="bg-white/20 px-3 py-1 rounded-lg text-xl sm:text-2xl">{cat.id}</span> 
                            <span>{cat.name}</span>
                          </div>
                          <span className="text-xs sm:text-sm font-normal bg-black/20 px-2 sm:px-3 py-1 rounded-full whitespace-nowrap">
                            {isOpen ? 'เปิดบริการ' : 'ปิด'}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {step === 2 && (
              <div className="animate-fade-in">
                <button onClick={() => setStep(1)} className="text-slate-400 hover:text-slate-600 mb-6 flex items-center gap-1 font-medium"><span className="material-icons-round text-sm">arrow_back</span> ย้อนกลับ</button>
                <h2 className="text-2xl font-bold text-slate-800 mb-2">ระบุชื่อของคุณ</h2>
                <p className="text-slate-500 mb-6 text-sm">แผนก: <span className="font-semibold text-indigo-600">{selectedCat && selectedCat.name}</span></p>
                <form onSubmit={handleReserve} className="space-y-4">
                  <input type="text" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น..." className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-lg bg-slate-50 outline-none" value={name} onChange={(e) => setName(e.target.value)} disabled={loading} autoFocus />
                  <button type="submit" disabled={loading} className="btn-scale w-full bg-slate-800 text-white font-semibold py-4 rounded-2xl text-xl hover:bg-slate-900 transition flex justify-center items-center gap-2 shadow-xl">
                    {loading ? <span className="material-icons-round animate-spin">refresh</span> : <span className="material-icons-round">how_to_reg</span>}
                    ยืนยันรับคิว
                  </button>
                </form>
              </div>
            )}

            {step === 3 && myTicketData && (
              <div className="animate-fade-in">
                <div className="bg-gradient-to-br from-indigo-50 to-blue-50 rounded-[1.5rem] p-6 mb-6 border border-indigo-100 shadow-inner">
                  <p className="text-indigo-400 font-medium mb-1">หมายเลขคิวของคุณ</p>
                  <div className="text-6xl sm:text-7xl font-bold text-indigo-600 my-3 tracking-tighter">{myTicketData && myTicketData.queueString}</div>
                  
                  {/* 📌 เพิ่มการแสดงชื่อลูกค้าที่นี่ */}
                  <p className="text-sm font-semibold text-slate-600 bg-white inline-block px-4 py-1.5 rounded-full shadow-sm mb-3">
                    คุณ {myTicketData && myTicketData.name} • {myTicketData && myTicketData.categoryName}
                  </p>
                  
                  <div className="text-[10px] sm:text-xs text-slate-400 flex flex-wrap items-center justify-center gap-1 border-t border-indigo-100 pt-3">
                    <span className="material-icons-round text-sm">schedule</span>
                    <span>กดรับคิวเมื่อ: {formatDate(myTicketData.createdAt)} เวลา {formatTime(myTicketData.createdAt)}</span>
                  </div>
                </div>
                
                <div className="border border-slate-100 rounded-2xl p-4 sm:p-5 text-left space-y-4 bg-white">
                  <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                    <span className="text-slate-500 font-medium flex items-center gap-2 text-sm sm:text-base">
                      <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse-fast"></div>กำลังเรียก (รวม)
                    </span>
                    <span className="text-xl sm:text-2xl font-bold text-slate-800">{displayStatus.currentQueue}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-slate-500 font-medium text-sm sm:text-base">คิวของคุณรออีก</span>
                    <span className="text-lg sm:text-2xl font-bold text-rose-500 bg-rose-50 px-3 py-1 rounded-lg">{queuesAhead} คิว</span>
                  </div>
                </div>
                
                <p className="text-[10px] sm:text-xs text-slate-400 mt-6">* คุณสามารถเปิดหน้านี้ทิ้งไว้เพื่อดูคิวแบบเรียลไทม์</p>
                <button onClick={() => { setMyTicketId(null); setMyTicketData(null); setShowAlert(false); setStep(1); }} className="mt-4 text-sm text-indigo-500 font-medium hover:underline">← กลับหน้าแรกเพื่อรับคิวใหม่</button>
              </div>
            )}

            {showAlert && (
              <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in">
                <div className="bg-white rounded-[2rem] p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-slate-100">
                  <div className="w-16 sm:w-20 h-16 sm:h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                    <span className="material-icons-round text-3xl sm:text-4xl">campaign</span>
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">ถึงคิวของคุณแล้ว!</h2>
                  <div className="text-5xl sm:text-6xl font-extrabold text-indigo-600 my-3">{myTicketData && myTicketData.queueString}</div>
                  <p className="text-base sm:text-lg font-semibold text-slate-700 bg-emerald-50 py-3 rounded-xl mb-6 text-emerald-700">
                    เชิญที่ช่องบริการที่ <span className="text-xl sm:text-2xl font-black">{displayStatus.counter || 1}</span>
                  </p>
                  <button onClick={() => setShowAlert(false)} className="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl hover:bg-slate-900 transition shadow-lg">
                    รับทราบ
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

   /* 💻 2.2 หน้าแผงควบคุมพนักงาน (Admin View) */
    const AdminView = ({ displayStatus, waitingTickets, calledTickets }) => {
      const [activeCounter, setActiveCounter] = useState("1");
      const [counters, setCounters] = useState([]);
      const [showQRModal, setShowQRModal] = useState(false);

      useEffect(() => {
        return db.collection('counters').onSnapshot(snapshot => {
          let list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          list.sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));
          setCounters(list);
          if (list.length > 0 && !list.some(c => c.id === activeCounter)) {
            setActiveCounter(list[0].id);
          }
        });
      }, [activeCounter]);

      const currentCounterObj = counters.find(c => c.id === activeCounter);
      const isCurrentOpen = currentCounterObj ? currentCounterObj.isOpen !== false : true;

      const manageQueue = async (action, ticket) => {
        if (!isCurrentOpen) {
          return alert(`โต๊ะ/ช่องบริการที่ ${activeCounter} ปิดให้บริการอยู่ กรุณาเปิดสถานะที่หน้าจัดการระบบ`);
        }

        try {
          const batch = db.batch();
          if (action === 'CALL' || action === 'RECALL') {
            const now = Date.now();
            if (action === 'CALL') {
              batch.update(db.collection('tickets').doc(ticket.id), { status: "called", calledAt: now });
            } else if (action === 'RECALL') {
              // 📌 อัปเดตเวลาการเรียกซ้ำ เพื่อให้หน้าจอลูกค้าแจ้งเตือนอีกครั้ง
              batch.update(db.collection('tickets').doc(ticket.id), { calledAt: now });
            }
            batch.set(db.collection('store_status').doc('display'), {
              currentQueue: ticket.queueString,
              counter: activeCounter,
              lastTrigger: now
            }, { merge: true });

          } else if (action === 'SKIP') {
            batch.update(db.collection('tickets').doc(ticket.id), { status: "skipped" });
          }
          await batch.commit();
        } catch (error) {
          alert("เกิดข้อผิดพลาดในการดำเนินการ");
        }
      };

      const handleCallNext = () => {
        if (waitingTickets.length > 0) manageQueue('CALL', waitingTickets[0]);
        else alert("ไม่มีคิวรอในขณะนี้");
      };

      // 📌 ฟังก์ชันดาวน์โหลด QR Code
      const handleDownloadQR = async () => {
        try {
          const url = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(window.location.href.split('?')[0] + '?mode=kiosk')}`;
          const response = await fetch(url);
          const blob = await response.blob();
          const blobUrl = window.URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = 'QR-Queue-System.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (e) {
          // หากโดนบล็อกการโหลด ให้เปิดรูปแท็บใหม่แทน
          window.open(`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(window.location.href.split('?')[0] + '?mode=kiosk')}`, '_blank');
        }
      };

      return (
        <div className="animate-fade-in w-full max-w-6xl mx-auto flex flex-col lg:flex-row gap-6 pt-4 pb-12">
          <div className="flex-1 space-y-6">
            <div className="glass-card p-4 sm:p-6 rounded-[2rem]">
              <h1 className="text-xl sm:text-2xl font-bold text-slate-800 mb-2 sm:mb-4 flex items-center gap-2">
                <span className="material-icons-round text-indigo-500">meeting_room</span> เลือกโต๊ะปฏิบัติงานของคุณ
              </h1>
              <p className="text-xs sm:text-sm text-slate-500 mb-4">คลิกเลือกโต๊ะที่ท่านประจำการเพื่อเริ่มเรียกคิว</p>

              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-3 gap-3 mb-6">
                {counters.length === 0 ? (
                  <p className="text-slate-400 col-span-full py-4 text-center">ยังไม่มีโต๊ะในระบบ โปรดไปเพิ่มที่เมนู "จัดการระบบ"</p>
                ) : (
                  counters.map(c => {
                    const isOpen = c.isOpen !== false;
                    const isSelected = activeCounter === c.id;
                    return (
                      <button 
                        key={c.id} 
                        onClick={() => setActiveCounter(c.id)}
                        className={`p-3 sm:p-4 rounded-2xl border text-left transition-all flex flex-col justify-between ${isSelected ? 'border-indigo-600 bg-indigo-50/80 shadow-md ring-2 ring-indigo-400' : 'border-slate-200 bg-white hover:bg-slate-50'}`}
                      >
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-bold text-slate-800 text-base sm:text-lg truncate">โต๊ะ {c.id}</span>
                          {isSelected && <span className="text-[10px] sm:text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-full ml-1">ของคุณ</span>}
                        </div>
                        <p className="text-[10px] sm:text-xs text-slate-500 mb-2 truncate">{c.name}</p>
                        <div className="pt-2 border-t border-slate-100 flex justify-between items-center mt-auto">
                          <span className={`text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-lg ${isOpen ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                            {isOpen ? '🟢 เปิด' : '🔴 ปิด'}
                          </span>
                        </div>
                      </button>
                    );
                  })
                )}
              </div>

              <div className="bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200 mb-6">
                <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-3">
                  <span className="font-bold text-slate-700 text-sm sm:text-base">กำลังปฏิบัติงานที่: <span className="text-indigo-600 text-lg font-black">โต๊ะ {activeCounter}</span></span>
                  <span className={`inline-block text-center px-3 py-1 rounded-full text-xs font-bold w-fit ${isCurrentOpen ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}`}>
                    {isCurrentOpen ? 'พร้อมรับคิว' : 'โต๊ะนี้ปิดบริการอยู่'}
                  </span>
                </div>
                <div className="grid grid-cols-2 gap-3 text-center mb-4">
                  <div className="bg-white p-3 rounded-xl border">
                    <p className="text-[10px] sm:text-xs text-slate-400">เรียกล่าสุด</p>
                    <p className="text-xl sm:text-2xl font-bold text-slate-800">{displayStatus.currentQueue}</p>
                  </div>
                  <div className="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                    <p className="text-[10px] sm:text-xs text-indigo-500 font-medium">คิวรอภาพรวม</p>
                    <p className="text-xl sm:text-2xl font-bold text-indigo-600">{waitingTickets.length}</p>
                  </div>
                </div>

                <button 
                  onClick={handleCallNext} 
                  disabled={!isCurrentOpen}
                  className={`btn-scale w-full font-bold text-base sm:text-lg py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2 ${isCurrentOpen ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
                >
                  <span className="material-icons-round">campaign</span> เรียกคิวถัดไป <span className="hidden sm:inline">(สำหรับโต๊ะ {activeCounter})</span>
                </button>
              </div>

              <button onClick={() => setShowQRModal(true)} className="w-full bg-slate-50 text-slate-600 font-medium py-3 rounded-xl border border-slate-200 hover:bg-slate-100 transition flex items-center justify-center gap-2 text-sm sm:text-base">
                <span className="material-icons-round">qr_code</span> สร้าง QR Code ให้ลูกค้า
              </button>
            </div>

            <div className="glass-card p-4 sm:p-6 rounded-[2rem]">
              <h2 className="text-base sm:text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="material-icons-round text-orange-400">history</span> ประวัติการเรียก (10 คิวล่าสุด)</h2>
              <div className="space-y-3 max-h-48 sm:max-h-60 overflow-y-auto no-scrollbar">
                {calledTickets.length === 0 && <p className="text-slate-400 text-sm text-center">ยังไม่มีประวัติ</p>}
                {calledTickets.map(t => (
                  <div key={t.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span className="font-bold text-slate-700 text-sm sm:text-base">{t.queueString} <span className="text-xs sm:text-sm font-normal text-slate-400 ml-1 sm:ml-2 truncate max-w-[100px] sm:max-w-[150px] inline-block align-bottom">({t.name})</span></span>
                    <button onClick={() => manageQueue('RECALL', t)} className="btn-scale bg-orange-100 text-orange-600 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-bold hover:bg-orange-200 whitespace-nowrap">เรียกซ้ำ</button>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="w-full lg:w-96 glass-card p-4 sm:p-6 rounded-[2rem] flex flex-col h-[400px] sm:h-[500px] lg:h-[700px]">
            <h2 className="text-lg sm:text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><span className="material-icons-round text-emerald-500">list_alt</span> โซนคิวรอทั้งหมด</h2>
            <div className="flex-1 overflow-y-auto no-scrollbar space-y-3">
              {waitingTickets.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-slate-300">
                  <span className="material-icons-round text-5xl sm:text-6xl mb-2">check_circle</span>
                  <p className="text-sm sm:text-base">เคลียร์คิวหมดแล้ว</p>
                </div>
              ) : (
                waitingTickets.map(t => (
                  <div key={t.id} className="bg-white p-3 sm:p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col gap-3">
                    <div className="flex items-center gap-3 sm:gap-4">
                      <div className="w-12 h-12 sm:w-14 sm:h-14 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl sm:text-2xl font-bold flex-none">{t.queueString}</div>
                      <div className="overflow-hidden">
                        <div className="text-xs sm:text-sm text-slate-500 font-medium truncate">หมวด: {t.categoryName}</div>
                        <div className="text-base sm:text-lg font-bold text-slate-800 truncate">{t.name}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => manageQueue('CALL', t)} className="btn-scale flex-1 bg-emerald-500 text-white py-2 rounded-xl font-semibold hover:bg-emerald-600 shadow-md text-xs sm:text-sm">เรียกโต๊ะ {activeCounter}</button>
                      <button onClick={() => manageQueue('SKIP', t)} className="btn-scale flex-none bg-rose-50 text-rose-600 px-3 py-2 rounded-xl font-semibold hover:bg-rose-100 border border-rose-100 text-xs sm:text-sm">ข้าม</button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* 📌 หน้าต่าง QR Code ที่เพิ่มปุ่มบันทึกภาพ */}
          {showQRModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] px-4">
              <div className="bg-white p-6 sm:p-8 rounded-[2rem] text-center max-w-sm w-full shadow-2xl animate-fade-in border border-slate-100">
                <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-1">สแกนรับคิวออนไลน์</h2>
                <p className="text-xs sm:text-sm text-slate-500 mb-4">ลูกค้าสามารถติดตามคิวผ่านมือถือได้ทันที</p>
                <div className="bg-slate-50 p-4 rounded-2xl inline-block mb-6 border border-slate-100">
                  <img src={`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(window.location.href.split('?')[0] + '?mode=kiosk')}`} alt="QR Code" className="w-40 h-40 sm:w-48 sm:h-48 mx-auto mix-blend-multiply" />
                </div>
                <div className="flex gap-2">
                  <button onClick={handleDownloadQR} className="btn-scale bg-indigo-600 text-white font-bold px-4 py-3 sm:py-3.5 rounded-xl flex-1 hover:bg-indigo-700 text-sm sm:text-base flex items-center justify-center gap-1 shadow-md">
                    <span className="material-icons-round text-base">download</span> บันทึกภาพ
                  </button>
                  <button onClick={() => setShowQRModal(false)} className="btn-scale bg-slate-100 text-slate-700 font-bold px-4 py-3 sm:py-3.5 rounded-xl flex-1 hover:bg-slate-200 text-sm sm:text-base">ปิดหน้าต่าง</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

  /* 🛠️ 2.3 หน้าจัดการระบบหลังบ้าน (Manager Panel) */
    const ManagerView = ({ setModalMessage, setConfirmDialog, setPromptDialog, setPromptValue }) => {
      const [tickets, setTickets] = useState([]);
      const [categories, setCategories] = useState([]);
      const [counters, setCounters] = useState([]);
      
      const [newCatId, setNewCatId] = useState("");
      const [newCatName, setNewCatName] = useState("");
      const [newCounterId, setNewCounterId] = useState("");
      const [newCounterName, setNewCounterName] = useState("");
      
      const [tvHeader, setTvHeader] = useState("");
      
      // 📌 State สำหรับตั้งค่าประโยคเสียงอ่าน
      const [speechPrefix, setSpeechPrefix] = useState("ขอเชิญหมายเลข");
      const [speechMiddle, setSpeechMiddle] = useState("ที่ช่องบริการ");
      const [speechSuffix, setSpeechSuffix] = useState("ค่ะ");

      const [floorConfig, setFloorConfig] = useState({
        nurse: { x: 20, y: 20 },
        waiting: { x: 180, y: 20 },  
        door: { x: 900, y: 50 },      
        blank1: { x: 180, y: 150 } 
      });

      const [draggingId, setDraggingId] = useState(null);
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });

      useEffect(() => {
        const unsubTickets = db.collection('tickets').onSnapshot(snapshot => {
          setTickets(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubCats = db.collection('categories').onSnapshot(snapshot => {
          setCategories(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubCounters = db.collection('counters').onSnapshot(snapshot => {
          let list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          list.sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));
          setCounters(list);
        });

        db.collection('store_status').doc('floor_config').get().then(doc => {
          if (doc.exists) setFloorConfig(doc.data());
          else db.collection('store_status').doc('floor_config').set(floorConfig);
        });

        // 📌 โหลดข้อมูลการตั้งค่าทีวีและเสียง
        db.collection('store_status').doc('display').get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            if (data.tvHeaderTitle) setTvHeader(data.tvHeaderTitle);
            if (data.speechPrefix) setSpeechPrefix(data.speechPrefix);
            if (data.speechMiddle) setSpeechMiddle(data.speechMiddle);
            if (data.speechSuffix !== undefined) setSpeechSuffix(data.speechSuffix);
          }
        });

        return () => { unsubTickets(); unsubCats(); unsubCounters(); };
      }, []);

      const handleMouseDown = (e, id) => {
        setDraggingId(id);
        const rect = e.currentTarget.getBoundingClientRect();
        setDragOffset({ x: e.clientX - rect.left, y: e.clientY - rect.top });
      };

      const handleMouseMove = async (e) => {
        if (!draggingId) return;
        const container = document.getElementById('floor-plan-area');
        if (!container) return;
        const rect = container.getBoundingClientRect();

        let x = e.clientX - rect.left - dragOffset.x;
        let y = e.clientY - rect.top - dragOffset.y;

        if (x < 10) x = 10;
        if (y < 10) y = 10;

        if (draggingId === 'nurse' || draggingId === 'waiting' || draggingId === 'door' || draggingId === 'blank1') {
          const updated = { ...floorConfig, [draggingId]: { x, y } };
          setFloorConfig(updated);
          await db.collection('store_status').doc('floor_config').set(updated, { merge: true });
        } else {
          await db.collection('counters').doc(draggingId).update({ posX: x, posY: y }, { merge: true });
        }
      };

      const handleMouseUp = () => setDraggingId(null);

      const handleEditName = (ticketId, currentName) => {
        setPromptValue(currentName);
        setPromptDialog({
          message: "แก้ไขชื่อลูกค้า:",
          onConfirm: async (newName) => {
            if (newName && newName.trim() !== "") {
              await db.collection('tickets').doc(ticketId).update({ name: newName.trim() });
              setModalMessage("แก้ไขชื่อคิวเรียบร้อยแล้ว");
            }
          }
        });
      };

      const handleDeleteTicket = (ticketId) => {
        setConfirmDialog({
          message: "ต้องการลบคิวนี้ออกจากระบบใช่หรือไม่?",
          onConfirm: async () => {
            await db.collection('tickets').doc(ticketId).delete();
            setModalMessage("ลบคิวเรียบร้อยแล้ว");
          }
        });
      };

      const handleAddCategory = async (e) => {
        e.preventDefault();
        if (!newCatId || !newCatName) return setModalMessage("กรุณากรอกรหัส (เช่น A) และชื่อบริการ");
        await db.collection('categories').doc(newCatId.toUpperCase()).set({
          name: newCatName.trim(), isOpen: true, style: 'from-indigo-500 to-blue-600'
        });
        setNewCatId(""); setNewCatName("");
        setModalMessage("เพิ่มหมวดหมู่บริการเรียบร้อยแล้ว!");
      };

      const handleEditCategory = (catId, currentName) => {
        setPromptValue(currentName);
        setPromptDialog({
          message: `แก้ไขชื่อบริการสำหรับหมวด [${catId}]:`,
          onConfirm: async (updatedName) => {
            if (updatedName && updatedName.trim() !== "") {
              await db.collection('categories').doc(catId).update({ name: updatedName.trim() });
              setModalMessage("แก้ไขชื่อหมวดหมู่เรียบร้อยแล้ว");
            }
          }
        });
      };

      const handleDeleteCategory = (catId) => {
        setConfirmDialog({
          message: `ต้องการลบแผนก [${catId}] ใช่หรือไม่?`,
          onConfirm: async () => {
            await db.collection('categories').doc(catId).delete();
            setModalMessage("ลบแผนกเรียบร้อยแล้ว");
          }
        });
      };

      const handleToggleCategoryOpen = async (catId, currentStatus) => {
        await db.collection('categories').doc(catId).update({ isOpen: !currentStatus });
      };

      const handleAddCounter = async (e) => {
        e.preventDefault();
        if (!newCounterId || !newCounterName) return setModalMessage("กรุณากรอกเลขโต๊ะและชื่อโต๊ะเจ้าหน้าที่");
        await db.collection('counters').doc(newCounterId.trim()).set({
          name: newCounterName.trim(), isOpen: true, posX: 180 + (counters.length * 150) % 500, posY: 280
        });
        setNewCounterId(""); setNewCounterName("");
        setModalMessage("เพิ่มโต๊ะเจ้าหน้าที่เรียบร้อยแล้ว!");
      };

      const handleEditCounter = (counterId, currentName) => {
        setPromptValue(currentName);
        setPromptDialog({
          message: `แก้ไขชื่อโต๊ะเจ้าหน้าที่ [โต๊ะ ${counterId}]:`,
          onConfirm: async (updatedName) => {
            if (updatedName && updatedName.trim() !== "") {
              await db.collection('counters').doc(counterId).update({ name: updatedName.trim() });
              setModalMessage("แก้ไขชื่อโต๊ะเรียบร้อยแล้ว");
            }
          }
        });
      };

      const handleDeleteCounter = (counterId) => {
        setConfirmDialog({
          message: `ต้องการลบโต๊ะที่ ${counterId} ออกจากผังใช่หรือไม่?`,
          onConfirm: async () => {
            await db.collection('counters').doc(counterId).delete();
            setModalMessage("ลบโต๊ะเรียบร้อยแล้ว");
          }
        });
      };

      const handleToggleCounterOpen = async (counterId, currentStatus) => {
        await db.collection('counters').doc(counterId).update({ isOpen: !currentStatus });
      };

      const handleSaveTvHeader = async () => {
        await db.collection('store_status').doc('display').set({ tvHeaderTitle: tvHeader.trim() }, { merge: true });
        setModalMessage("บันทึกแถบหัวข้อจอแสดงผล (TV) เรียบร้อยแล้ว!");
      };

      // 📌 ฟังก์ชันบันทึกการตั้งค่าเสียงอ่านคิว
      const handleSaveSpeechSettings = async () => {
        await db.collection('store_status').doc('display').set({ 
          speechPrefix: speechPrefix.trim(),
          speechMiddle: speechMiddle.trim(),
          speechSuffix: speechSuffix.trim()
        }, { merge: true });
        setModalMessage("บันทึกการตั้งค่าประโยคเสียงอ่านคิวเรียบร้อยแล้ว!");
      };

      const handleResetQueue = () => {
        setConfirmDialog({
          message: "⚠️ คำเตือน: การรีเซ็ตจะล้างข้อมูลคิวทั้งหมดของวันนี้ ข้อมูลที่ถูกลบจะไม่สามารถกู้คืนได้ ต้องการดำเนินการต่อหรือไม่?",
          onConfirm: async () => {
            const batch = db.batch();
            const snapshot = await db.collection('tickets').get();
            snapshot.forEach(doc => batch.delete(doc.ref));
            batch.set(db.collection('store_status').doc('display'), { currentQueue: "-", counter: "1", lastTrigger: 0 }, { merge: true });
            await batch.commit();
            setModalMessage("ล้างข้อมูลคิวทั้งหมดของวันนี้เรียบร้อยแล้ว!");
          }
        });
      };

      return (
        <div className="animate-fade-in w-full max-w-6xl mx-auto py-6 md:py-10 space-y-6 md:space-y-8">
          <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-xl border border-slate-100">
            <h1 className="text-2xl md:text-3xl font-bold text-slate-800 mb-2 flex items-center gap-3">
              <span className="material-icons-round text-indigo-600">settings</span> ระบบจัดการหลังบ้าน <span className="hidden sm:inline">(Manager Panel)</span>
            </h1>
            <p className="text-sm md:text-base text-slate-500">จัดการผังโต๊ะเจ้าหน้าที่แบบจำลองห้อง, หมวดหมู่บริการ Kiosk, หัวข้อจอทีวี และจัดการข้อมูลคิว</p>
          </div>

          {/* ผังห้อง */}
          <div className="bg-white p-4 md:p-6 rounded-[2rem] shadow-lg border border-slate-100">
            <div className="flex flex-col sm:flex-row justify-between sm:items-center mb-4 gap-2">
              <h3 className="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-2">
                <span className="material-icons-round text-indigo-500">room_preferences</span> จำลองผังห้องปฏิบัติงาน <span className="hidden sm:inline">(ลากวางโต๊ะได้)</span>
              </h3>
              <p className="text-[10px] md:text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded-md w-fit">💡 เลื่อนซ้ายขวาเพื่อดูผังห้องได้</p>
            </div>

            <div className="w-full overflow-x-auto pb-4 no-scrollbar">
              <div 
                id="floor-plan-area" 
                onMouseMove={handleMouseMove} 
                onMouseUp={handleMouseUp}
                className="min-w-[1000px] h-[450px] bg-slate-900 rounded-3xl relative overflow-hidden border-2 border-dashed border-slate-700 shadow-inner p-4"
              >
                {/* โซนที่นั่งรอคิว */}
                <div 
                  onMouseDown={(e) => handleMouseDown(e, 'waiting')}
                  style={{ left: `${floorConfig.waiting ? floorConfig.waiting.x : 180}px`, top: `${floorConfig.waiting ? floorConfig.waiting.y : 20}px` }}
                  className="absolute cursor-grab active:cursor-grabbing bg-slate-800/90 border-2 border-slate-600 rounded-2xl w-[650px] h-[100px] text-slate-300 text-sm font-semibold flex flex-row items-center justify-center gap-4 shadow-xl select-none"
                >
                  <span className="material-icons-round text-emerald-400 text-4xl">event_seat</span> 
                  <span className="text-xl tracking-wider">โซนที่นั่งรอคิว</span>
                </div>

                {/* ประตูทางเข้า */}
                <div 
                  onMouseDown={(e) => handleMouseDown(e, 'door')}
                  style={{ left: `${floorConfig.door ? floorConfig.door.x : 900}px`, top: `${floorConfig.door ? floorConfig.door.y : 50}px` }}
                  className="absolute cursor-grab active:cursor-grabbing w-10 h-[160px] bg-amber-500/90 border-2 border-amber-400 rounded-xl flex items-center justify-center text-slate-950 font-bold shadow-xl select-none"
                >
                  <span className="-rotate-90 whitespace-nowrap text-sm flex items-center gap-1 tracking-widest">
                     ประตู
                  </span>
                </div>

                {/* พื้นที่ว่าง (ลากได้) */}
                <div 
                  onMouseDown={(e) => handleMouseDown(e, 'blank1')}
                  style={{ left: `${floorConfig.blank1 ? floorConfig.blank1.x : 180}px`, top: `${floorConfig.blank1 ? floorConfig.blank1.y : 150}px` }}
                  className="absolute cursor-grab active:cursor-grabbing w-32 h-24 bg-slate-200/20 border-2 border-slate-400 border-dashed rounded-xl flex flex-col items-center justify-center text-slate-400 shadow-sm select-none hover:bg-slate-200/40 transition"
                >
                  <span className="material-icons-round text-2xl mb-1 opacity-50">crop_free</span>
                  <span className="font-semibold text-xs">พื้นที่ว่าง</span>
                </div>

                {/* โต๊ะเจ้าหน้าที่ทั้งหมด */}
                {counters.map(c => {
                  const posX = c.posX || 200;
                  const posY = c.posY || 280;
                  const isOpen = c.isOpen !== false;
                  const isNurse = c.id === 'งานพยาบาล' || (c.name && c.name.includes('พยาบาล'));

                  if (isNurse) {
                    return (
                      <div
                        key={c.id}
                        onMouseDown={(e) => handleMouseDown(e, c.id)}
                        style={{ left: `${posX}px`, top: `${posY}px` }}
                        className={`absolute cursor-grab active:cursor-grabbing w-32 h-[320px] bg-teal-950/90 border-2 rounded-2xl flex flex-col items-center justify-between text-teal-200 p-3 shadow-xl select-none ${isOpen ? 'border-emerald-500' : 'border-rose-400 opacity-90'}`}
                      >
                        <div className="w-full bg-white/95 rounded-xl p-2 flex flex-col items-center gap-2 shadow-sm">
                          <span className="font-bold text-slate-800 text-sm text-center">โต๊ะ {c.id}</span>
                          <button 
                            onMouseDown={(e) => e.stopPropagation()} 
                            onClick={() => handleToggleCounterOpen(c.id, isOpen)}
                            className={`flex flex-col items-center justify-center w-full py-2 rounded-lg border shadow-sm transition-transform hover:scale-105 ${isOpen ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'}`}
                          >
                             <span className={`w-3 h-3 rounded-full mb-1 ${isOpen ? 'bg-emerald-500 animate-pulse-fast' : 'bg-rose-500'}`}></span>
                             <span className="text-[10px] font-extrabold leading-none">{isOpen ? 'เปิดรับ' : 'ปิดคิว'}</span>
                          </button>
                        </div>
                        <span className="material-icons-round text-4xl text-teal-400 mt-2">local_hospital</span>
                        <span className="font-bold text-sm -rotate-90 whitespace-nowrap tracking-widest mb-10 text-teal-300">{c.name}</span>
                      </div>
                    );
                  }

                  return (
                    <div
                      key={c.id}
                      onMouseDown={(e) => handleMouseDown(e, c.id)}
                      style={{ left: `${posX}px`, top: `${posY}px` }}
                      className={`absolute cursor-grab active:cursor-grabbing w-56 bg-white/95 backdrop-blur-md rounded-2xl p-4 shadow-xl border-2 transition-shadow select-none ${isOpen ? 'border-emerald-500' : 'border-rose-400 opacity-80'}`}
                    >
                      <div className="flex justify-between items-start mb-1">
                        <div>
                          <span className="font-bold text-slate-800 text-base block">โต๊ะ {c.id}</span>
                          <span className="text-xs text-slate-500 truncate block w-28">{c.name}</span>
                        </div>
                        <button 
                          onMouseDown={(e) => e.stopPropagation()} 
                          onClick={() => handleToggleCounterOpen(c.id, isOpen)}
                          className={`flex flex-col items-center justify-center px-3 py-2 rounded-lg border shadow-sm transition-transform hover:scale-105 ${isOpen ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'}`}
                          title="กดเพื่อเปิด/ปิดรับคิว"
                        >
                           <span className={`w-3.5 h-3.5 rounded-full mb-1.5 ${isOpen ? 'bg-emerald-500 animate-pulse-fast' : 'bg-rose-500'}`}></span>
                           <span className="text-[10px] font-extrabold leading-none">{isOpen ? 'เปิดรับ' : 'ปิดคิว'}</span>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

    /* 📺 2.4 จอแสดงผลทีวี (TV Display) */
    const DisplayView = ({ displayStatus, waitingTickets, calledTickets, hideNavbar, setHideNavbar }) => { // 📌 ต้องรับ calledTickets เพิ่มมาด้วย
      const [isStarted, setIsStarted] = useState(false);
      const lastPlayedRef = useRef(0);
      const [headerTitle, setHeaderTitle] = useState("ระบบคิวอัตโนมัติ Real-time Q-System");
      
      const [speechSettings, setSpeechSettings] = useState({
        prefix: "ขอเชิญหมายเลข",
        middle: "ที่ช่องบริการ",
        suffix: "ค่ะ"
      });

      useEffect(() => {
        const unsub = db.collection('store_status').doc('display').onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data();
            if (data.tvHeaderTitle) setHeaderTitle(data.tvHeaderTitle);
            
            setSpeechSettings({
              prefix: data.speechPrefix !== undefined ? data.speechPrefix : "ขอเชิญหมายเลข",
              middle: data.speechMiddle !== undefined ? data.speechMiddle : "ที่ช่องบริการ",
              suffix: data.speechSuffix !== undefined ? data.speechSuffix : "ค่ะ"
            });
          }
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        if (!isStarted) return;
        if (displayStatus.lastTrigger > lastPlayedRef.current) {
          lastPlayedRef.current = displayStatus.lastTrigger;
          
          const qElem = document.getElementById('tv-queue');
          if(qElem) { qElem.classList.add('scale-110', 'text-yellow-300'); setTimeout(() => qElem.classList.remove('scale-110', 'text-yellow-300'), 1500); }

          const chime = document.getElementById('chime-sound');
          if (chime) {
            chime.currentTime = 0;
            chime.play().catch(e => console.log(e));
          }

          setTimeout(() => {
            if ('speechSynthesis' in window && displayStatus.currentQueue !== "-") {
              window.speechSynthesis.cancel();
              const text = `${speechSettings.prefix} ${displayStatus.currentQueue.split('').join(' ')} ${speechSettings.middle} ${displayStatus.counter} ${speechSettings.suffix}`;
              
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'th-TH'; 
              utterance.rate = 0.70; 
              utterance.pitch = 1.2;
              
              const voices = window.speechSynthesis.getVoices();
              const thaiVoice = voices.find(voice => voice.lang === 'th-TH' || voice.name.includes('Thai'));
              if (thaiVoice) utterance.voice = thaiVoice;

              window.speechSynthesis.speak(utterance);
            }
          }, 1500);
        }
      }, [displayStatus.lastTrigger, isStarted, speechSettings]);

      if (!isStarted) {
        return (
          <div className="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
            <button onClick={() => setIsStarted(true)} className="btn-scale w-full max-w-sm bg-white text-indigo-900 px-6 sm:px-10 py-8 rounded-3xl text-xl sm:text-2xl font-bold shadow-2xl flex flex-col items-center gap-4 text-center">
              <div className="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-4xl">▶️</div>
              เริ่มหน้าจอทีวี (เปิดระบบเสียง)
            </button>
          </div>
        );
      }

      return (
        <div className={`w-full max-w-[1400px] mx-auto bg-slate-900 rounded-3xl md:rounded-[2.5rem] shadow-2xl flex flex-col overflow-hidden border border-slate-700 animate-fade-in relative transition-all duration-500 ${hideNavbar ? 'h-[95vh] mt-2 md:mt-4' : 'h-[85vh] mt-2 md:mt-4'}`}>
          
          <div className="w-full bg-indigo-900/80 border-b border-indigo-700/50 py-3 md:py-4 px-4 md:px-8 text-center backdrop-blur-md flex justify-center items-center relative">
            <h1 className="text-lg sm:text-2xl md:text-3xl font-bold text-white tracking-wide truncate pr-10">{headerTitle}</h1>
            
            <button 
              onClick={() => setHideNavbar(!hideNavbar)}
              className="absolute right-3 md:right-6 p-1.5 md:p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition-all shadow-md z-50"
              title={hideNavbar ? "แสดงเมนูหลัก" : "ซ่อนเมนูให้เต็มจอ"}
            >
              <span className="material-icons-round text-xl md:text-2xl">
                {hideNavbar ? 'fullscreen_exit' : 'fullscreen'}
              </span>
            </button>
          </div>

          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
            <div className="w-full lg:w-2/3 bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 text-white p-6 sm:p-10 flex flex-col justify-center items-center relative overflow-hidden flex-1 lg:flex-auto min-h-[50%]">
              <div className="absolute top-0 right-0 w-[300px] md:w-[500px] h-[300px] md:h-[500px] bg-indigo-600 rounded-full mix-blend-screen filter blur-[100px] md:blur-[120px] opacity-20"></div>
              <div className="absolute bottom-0 left-0 w-[200px] md:w-[400px] h-[200px] md:h-[400px] bg-blue-500 rounded-full mix-blend-screen filter blur-[80px] md:blur-[100px] opacity-20"></div>
              
              <h2 className="text-2xl sm:text-3xl md:text-4xl font-medium mb-1 md:mb-2 text-indigo-200 tracking-wide z-10">หมายเลขคิว</h2>
              <div id="tv-queue" className="text-7xl sm:text-[10rem] md:text-[12rem] lg:text-[14rem] font-bold leading-none tracking-tighter my-1 md:my-2 z-10 text-white text-glow transition-all duration-300">
                {displayStatus.currentQueue}
              </div>
              <div className="mt-4 md:mt-6 bg-white/10 backdrop-blur-md border border-white/20 px-6 sm:px-10 py-3 sm:py-4 rounded-full text-2xl sm:text-3xl md:text-4xl font-bold flex items-center gap-2 sm:gap-4 z-10 shadow-xl whitespace-nowrap">
                ช่องบริการ <span className="text-yellow-400 text-3xl sm:text-4xl md:text-5xl ml-1 sm:ml-3 font-black">{displayStatus.counter}</span>
              </div>
            </div>

            {/* 📌 แบ่งโซนด้านขวาเป็น 2 ส่วน (คิวรอถัดไป & เรียกไปแล้ว) */}
            <div className="w-full lg:w-1/3 bg-slate-50 p-4 sm:p-6 lg:p-8 flex flex-col border-t lg:border-t-0 lg:border-l border-slate-800">
              
              {/* โซนที่ 1: คิวรอถัดไป */}
              <div className="flex-1 flex flex-col mb-4">
                <h3 className="text-lg sm:text-xl font-bold text-slate-800 mb-2 sm:mb-4 flex items-center gap-2 border-b border-slate-200 pb-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> คิวรอถัดไป
                </h3>
                <div className="flex flex-row lg:flex-col overflow-x-auto lg:overflow-y-auto no-scrollbar gap-2 lg:gap-3">
                  {waitingTickets.slice(0, 4).map(t => (
                    <div key={t.id} className="bg-white p-3 lg:p-4 rounded-xl shadow-sm border border-slate-200 text-center text-2xl sm:text-3xl font-bold text-slate-700 tracking-wide min-w-[120px] lg:min-w-0 flex-none">
                      {t.queueString}
                    </div>
                  ))}
                </div>
              </div>

              {/* โซนที่ 2: เรียกไปแล้ว */}
              <div className="flex-1 flex flex-col border-t border-slate-200 pt-4">
                <h3 className="text-lg sm:text-xl font-bold text-slate-500 mb-2 sm:mb-4 flex items-center gap-2 border-b border-slate-200 pb-2">
                  <span className="material-icons-round text-emerald-500 text-lg">history</span> เรียกไปแล้ว
                </h3>
                <div className="flex flex-row lg:flex-col overflow-x-auto lg:overflow-y-auto no-scrollbar gap-2 lg:gap-3 opacity-80">
                  {calledTickets.slice(0, 4).map(t => (
                    <div key={t.id} className="bg-slate-200 p-2 lg:p-3 rounded-xl shadow-inner border border-slate-300 text-center text-xl sm:text-2xl font-bold text-slate-600 tracking-wide min-w-[100px] lg:min-w-0 flex-none flex justify-center items-center px-4">
                      {t.queueString}
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </div>

          <audio id="chime-sound" src="https://actions.google.com/sounds/v1/alarms/chime_bell_ding.ogg" preload="auto"></audio>
        </div>
      );
    };

    // ==========================================
    // 3. Main App (Router & Real-time Listeners)
    // ==========================================
    const App = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlMode = urlParams.get('mode');
      const [view, setView] = useState(urlMode || 'admin');

      const [displayStatus, setDisplayStatus] = useState({ currentQueue: "-", counter: "1", lastTrigger: 0 });
      const [waitingTickets, setWaitingTickets] = useState([]);
      const [calledTickets, setCalledTickets] = useState([]);
      
      const [modalMessage, setModalMessage] = useState(null); 
      const [confirmDialog, setConfirmDialog] = useState(null); 
      const [promptDialog, setPromptDialog] = useState(null);
      const [promptValue, setPromptValue] = useState("");
      
      const [hideNavbar, setHideNavbar] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);

      useEffect(() => {
        const unsubStore = db.collection('store_status').doc('display').onSnapshot(doc => {
          if (doc.exists) setDisplayStatus(doc.data());
          else db.collection('store_status').doc('display').set({ currentQueue: "-", counter: "1", lastTrigger: 0 });
        });

        const unsubWaiting = db.collection('tickets').where('status', '==', 'waiting').onSnapshot(snapshot => {
          let list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => a.createdAt - b.createdAt);
          setWaitingTickets(list);
        });

        const unsubCalled = db.collection('tickets').where('status', '==', 'called').onSnapshot(snapshot => {
          let list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => b.calledAt - a.calledAt);
          setCalledTickets(list.slice(0, 10)); 
        });

        return () => { unsubStore(); unsubWaiting(); unsubCalled(); };
      }, []);

      const isIsolated = urlMode === 'kiosk' || urlMode === 'tv' || urlMode === 'manager';

      return (
        <div className="flex h-screen overflow-hidden">
          
          {/* ========================================== */}
          {/* 📌 แถบเมนูด้านข้าง (Sidebar) */}
          {/* ========================================== */}
          {!isIsolated && !hideNavbar && (
            <React.Fragment>
              {/* พื้นหลังสีดำจางๆ เวลาเปิดเมนูบนมือถือ */}
              {isSidebarOpen && (
                <div 
                  className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 md:hidden" 
                  onClick={() => setIsSidebarOpen(false)}
                ></div>
              )}

              <aside className={`fixed md:static inset-y-0 left-0 z-50 w-64 bg-white/90 backdrop-blur-xl shadow-2xl md:shadow-lg border-r border-white/40 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 flex flex-col`}>
                
                {/* โลโก้ด้านบนของเมนู */}
                <div className="h-16 md:h-20 flex items-center justify-between px-6 border-b border-slate-100 shrink-0">
                  <div className="flex items-center gap-3">
                    <img src="https://cdn-icons-png.flaticon.com/512/2913/2913076.png" alt="Logo" className="w-8 h-8 object-contain" />
                    <span className="font-bold text-indigo-700 text-xl tracking-wide">Q-System</span>
                  </div>
                  <button className="md:hidden text-slate-400 hover:text-rose-500 transition p-1" onClick={() => setIsSidebarOpen(false)}>
                    <span className="material-icons-round">close</span>
                  </button>
                </div>

                {/* รายการปุ่มเมนูแนวตั้ง */}
                <nav className="flex-1 px-4 py-6 space-y-2 overflow-y-auto no-scrollbar">
                  <button onClick={() => { setView('kiosk'); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition-all ${view === 'kiosk' ? 'bg-indigo-50 text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-50 hover:text-indigo-600'}`}>
                    <span className="material-icons-round">touch_app</span> 
                    <span className="text-base">รับคิว</span>
                  </button>
                  <button onClick={() => { setView('admin'); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition-all ${view === 'admin' ? 'bg-indigo-50 text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-50 hover:text-indigo-600'}`}>
                    <span className="material-icons-round">admin_panel_settings</span> 
                    <span className="text-base">แผงพนักงาน</span>
                  </button>
                  <button onClick={() => { setView('manager'); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition-all ${view === 'manager' ? 'bg-indigo-50 text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-50 hover:text-indigo-600'}`}>
                    <span className="material-icons-round">settings</span> 
                    <span className="text-base">จัดการระบบ</span>
                  </button>
                  
                  <div className="pt-4 pb-2">
                    <div className="border-t border-slate-100"></div>
                  </div>
                  
                  <button onClick={() => { setView('tv'); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition-all ${view === 'tv' ? 'bg-slate-800 text-white font-bold shadow-md' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-800'}`}>
                    <span className="material-icons-round">tv</span> 
                    <span className="text-base">จอทีวี (TV Display)</span>
                  </button>
                </nav>
                
                <div className="p-4 text-center text-[10px] text-slate-400 border-t border-slate-100 shrink-0">
                  Q-System Pro Max v2.0<br/>Smart Queue Management
                </div>
              </aside>
            </React.Fragment>
          )}

          {/* ========================================== */}
          {/* 📌 พื้นที่เนื้อหาหลักฝั่งขวา */}
          {/* ========================================== */}
          <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
            
            {/* แถบเรียกเมนูด้านบน (โผล่มาเฉพาะบนหน้าจอมือถือ/แท็บเล็ตเล็ก) */}
            {!isIsolated && !hideNavbar && (
              <header className="md:hidden h-16 bg-white/80 backdrop-blur-md shadow-sm flex items-center px-4 z-30 shrink-0 border-b border-slate-100">
                <button onClick={() => setIsSidebarOpen(true)} className="p-2 text-slate-600 rounded-xl hover:bg-slate-100 transition flex items-center justify-center">
                  <span className="material-icons-round text-2xl">menu</span>
                </button>
                <span className="ml-3 font-bold text-indigo-700 text-lg tracking-wide">Q-System</span>
              </header>
            )}

            <main className="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 flex flex-col relative no-scrollbar">
              {view === 'kiosk' && <CustomerView displayStatus={displayStatus} allWaitingTickets={waitingTickets} />}
              {view === 'admin' && <AdminView displayStatus={displayStatus} waitingTickets={waitingTickets} calledTickets={calledTickets} />}
              {view === 'manager' && (
                <ManagerView 
                  setModalMessage={setModalMessage} 
                  setConfirmDialog={setConfirmDialog} 
                  setPromptDialog={setPromptDialog} 
                  setPromptValue={setPromptValue} 
                />
              )}
              {view === 'tv' && <DisplayView displayStatus={displayStatus} waitingTickets={waitingTickets} calledTickets={calledTickets} hideNavbar={hideNavbar} setHideNavbar={setHideNavbar} />}
            </main>
          </div>

          {/* ========================================== */}
          {/* 📌 Popups แจ้งเตือนต่างๆ */}
          {/* ========================================== */}
          {modalMessage && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
              <div className="bg-white rounded-[2rem] p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-slate-100">
                <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="material-icons-round text-3xl">info</span>
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-2">แจ้งเตือนจากระบบ</h3>
                <p className="text-slate-600 mb-6 text-sm sm:text-base">{modalMessage}</p>
                <button onClick={() => setModalMessage(null)} className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-lg text-sm sm:text-base">
                  ตกลง
                </button>
              </div>
            </div>
          )}

          {confirmDialog && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
              <div className="bg-white rounded-[2rem] p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-slate-100">
                <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="material-icons-round text-3xl">warning</span>
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-2">ยืนยันการดำเนินการ</h3>
                <p className="text-slate-600 mb-6 text-sm sm:text-base">{confirmDialog.message}</p>
                <div className="flex gap-3">
                  <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl hover:bg-slate-200 transition text-sm sm:text-base">
                    ยกเลิก
                  </button>
                  <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="flex-1 bg-rose-600 text-white font-bold py-3.5 rounded-xl hover:bg-rose-700 transition shadow-lg text-sm sm:text-base">
                    ตกลง
                  </button>
                </div>
              </div>
            </div>
          )}

          {promptDialog && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
              <div className="bg-white rounded-[2rem] p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-slate-100">
                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="material-icons-round text-3xl">edit</span>
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-2">ระบุข้อมูล</h3>
                <p className="text-slate-600 mb-4 text-sm sm:text-base">{promptDialog.message}</p>
                <form onSubmit={(e) => { e.preventDefault(); promptDialog.onConfirm(promptValue); setPromptDialog(null); }}>
                  <input 
                    type="text" 
                    className="w-full p-3.5 border border-slate-200 rounded-xl outline-none text-base sm:text-lg mb-6 text-center focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition bg-slate-50 font-medium"
                    value={promptValue}
                    onChange={(e) => setPromptValue(e.target.value)}
                    autoFocus
                  />
                  <div className="flex gap-3">
                    <button type="button" onClick={() => setPromptDialog(null)} className="flex-1 bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl hover:bg-slate-200 transition text-sm sm:text-base">
                      ยกเลิก
                    </button>
                    <button type="submit" className="flex-1 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-lg text-sm sm:text-base">
                      บันทึก
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
