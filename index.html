<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Dee ระบบจองคิวออนไลน์</title>

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Material Icons (Round) -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
          animation: { 'fade-in': 'fadeIn 0.4s ease-out forwards' },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel (UMD/CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <!-- Firebase v10 Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #f8fafc; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // 1. Firebase Initialization
    // ==========================================
    // ⚠️ นำค่า Config จาก Firebase ของคุณมาใส่ตรงนี้
   const firebaseConfig = {
  apiKey: "AIzaSyB1vBRTD1namUalMXFB7cPhWwdZFONZ-yI",
  authDomain: "q-dee-v-1.firebaseapp.com",
  projectId: "q-dee-v-1",
  storageBucket: "q-dee-v-1.firebasestorage.app",
  messagingSenderId: "735028566995",
  appId: "1:735028566995:web:ee102df3aa20dc69042d26",
  measurementId: "G-LX6G6VEWQW"
};

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ==========================================
    // 2. Components
    // ==========================================

    // --- Customer View (หน้าลูกค้า) ---
    const CustomerView = ({ currentQueue }) => {
      const [name, setName] = useState("");
      const [loading, setLoading] = useState(false);

      const handleReserve = async (e) => {
        e.preventDefault();
        if (!name.trim()) return alert("กรุณาระบุชื่อของคุณ");
        setLoading(true);

        try {
          // ดึงหมายเลขคิวล่าสุด
          const snapshot = await db.collection('tickets')
            .orderBy('queueNumber', 'desc')
            .limit(1)
            .get();
          
          let newQueueNumber = 1;
          if (!snapshot.empty) {
            newQueueNumber = snapshot.docs[0].data().queueNumber + 1;
          }

          // บันทึกคิวใหม่ลง Firestore
          await db.collection('tickets').add({
            name: name.trim(),
            queueNumber: newQueueNumber,
            status: "waiting",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          alert(`จองคิวสำเร็จ!\nหมายเลขคิวของคุณคือ: ${newQueueNumber}`);
          setName("");
        } catch (error) {
          console.error("Error reserving queue:", error);
          alert("เกิดข้อผิดพลาดในการจองคิว โปรดตรวจสอบ Rules ใน Firebase Firestore");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="animate-fade-in w-full max-w-md mx-auto">
          <div className="bg-white p-8 rounded-[2rem] shadow-xl text-center border border-slate-100">
            <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-50 text-indigo-500 mb-4">
              <span className="material-icons-round text-3xl">confirmation_number</span>
            </div>
            <h2 className="text-slate-500 font-medium mb-2">คิวที่กำลังเรียกขณะนี้</h2>
            <div className="text-8xl font-bold text-indigo-600 mb-8 tracking-tighter">
              {currentQueue || "0"}
            </div>
            
            <form onSubmit={handleReserve} className="space-y-4">
              <div>
                <input
                  type="text"
                  placeholder="พิมพ์ชื่อของคุณที่นี่..."
                  className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-lg bg-slate-50 focus:bg-white transition-colors"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  disabled={loading}
                />
              </div>
              <button
                type="submit"
                disabled={loading}
                className="w-full bg-indigo-600 text-white font-semibold py-4 rounded-2xl text-xl hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center gap-2 disabled:opacity-70 shadow-lg shadow-indigo-200"
              >
                {loading ? (
                  <span className="material-icons-round animate-spin">refresh</span>
                ) : (
                  <span className="material-icons-round">touch_app</span>
                )}
                {loading ? "กำลังดำเนินการ..." : "กดรับคิว"}
              </button>
            </form>
          </div>
        </div>
      );
    };

    // --- Admin View (หน้าพนักงาน) ---
    const AdminView = ({ currentQueue, tickets }) => {
      const handleCallQueue = async (ticket) => {
        try {
          const batch = db.batch();
          
          // อัปเดตคิวปัจจุบันที่หน้าจอหลัก
          const mainCounterRef = db.collection('store_status').doc('main_counter');
          batch.set(mainCounterRef, { currentQueue: ticket.queueNumber }, { merge: true });

          // เปลี่ยนสถานะคิวเป็น เรียกแล้ว (called)
          const ticketRef = db.collection('tickets').doc(ticket.id);
          batch.update(ticketRef, { status: "called" });

          await batch.commit();
        } catch (error) {
          console.error("Error calling queue:", error);
          alert("เกิดข้อผิดพลาดในการเรียกคิว");
        }
      };

      return (
        <div className="animate-fade-in w-full max-w-4xl mx-auto flex flex-col md:flex-row gap-6">
          {/* Status Panel */}
          <div className="bg-white p-8 rounded-[2rem] shadow-lg text-center flex-1 md:w-1/3 h-fit border border-slate-100">
            <h2 className="text-slate-500 font-medium mb-2">คิวปัจจุบัน</h2>
            <div className="text-7xl font-bold text-indigo-600 mb-4 tracking-tight">
              {currentQueue || "0"}
            </div>
            <div className="bg-indigo-50 text-indigo-600 py-3 rounded-xl font-medium">
              รอรับบริการ: {tickets.length} คิว
            </div>
          </div>

          {/* Ticket List Panel */}
          <div className="bg-white p-8 rounded-[2rem] shadow-lg flex-1 md:w-2/3 border border-slate-100">
            <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3 border-b border-slate-100 pb-4">
              <span className="material-icons-round text-indigo-500 bg-indigo-50 p-2 rounded-lg">list_alt</span>
              รายการคิวที่รอ
            </h2>
            
            {tickets.length === 0 ? (
              <div className="text-center py-12 text-slate-400 flex flex-col items-center">
                <span className="material-icons-round text-6xl mb-3 text-slate-200">check_circle_outline</span>
                <p className="text-lg">ไม่มีคิวรอในขณะนี้</p>
              </div>
            ) : (
              <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                {tickets.map(ticket => (
                  <div key={ticket.id} className="flex items-center justify-between p-5 border border-slate-100 bg-slate-50 hover:bg-white rounded-2xl transition-colors shadow-sm">
                    <div className="flex items-center gap-4">
                      <div className="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-2xl font-bold">
                        {ticket.queueNumber}
                      </div>
                      <div>
                        <div className="text-sm text-slate-500 font-medium">ชื่อลูกค้า</div>
                        <div className="text-lg font-bold text-slate-800">{ticket.name}</div>
                      </div>
                    </div>
                    <button
                      onClick={() => handleCallQueue(ticket)}
                      className="bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-emerald-600 active:scale-95 transition-all shadow-md shadow-emerald-200 flex items-center gap-2"
                    >
                      <span className="material-icons-round">campaign</span>
                      เรียกคิว
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- Main App ---
    const App = () => {
      const [view, setView] = useState("customer"); 
      const [currentQueue, setCurrentQueue] = useState(0);
      const [tickets, setTickets] = useState([]);

      useEffect(() => {
        // 1. ดึงข้อมูลคิวปัจจุบัน (Real-time)
        const unsubCounter = db.collection('store_status').doc('main_counter')
          .onSnapshot(doc => {
            if (doc.exists) {
              setCurrentQueue(doc.data().currentQueue);
            }
          });

        // 2. ดึงข้อมูลรายการคิวที่รออยู่ (Real-time)
        const unsubTickets = db.collection('tickets')
          .where('status', '==', 'waiting')
          .onSnapshot(snapshot => {
            const fetchedTickets = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            // จัดเรียงจากน้อยไปมาก
            fetchedTickets.sort((a, b) => a.queueNumber - b.queueNumber);
            setTickets(fetchedTickets);
          });

        return () => {
          unsubCounter();
          unsubTickets();
        };
      }, []);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Navbar */}
          <nav className="bg-white shadow-sm border-b border-slate-100 mb-8 sticky top-0 z-50">
            <div className="max-w-5xl mx-auto px-6 h-20 flex items-center justify-between">
              <div className="font-bold text-2xl text-indigo-600 flex items-center gap-3">
                <div className="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center">
                  <span className="material-icons-round">devices</span>
                </div>
                Q-Dee
              </div>
              <div className="flex gap-2 bg-slate-100 p-1 rounded-xl">
                <button
                  onClick={() => setView('customer')}
                  className={`px-6 py-2.5 rounded-lg font-semibold transition-all flex items-center gap-2 ${view === 'customer' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  <span className="material-icons-round text-sm">smartphone</span>
                  หน้าลูกค้า
                </button>
                <button
                  onClick={() => setView('admin')}
                  className={`px-6 py-2.5 rounded-lg font-semibold transition-all flex items-center gap-2 ${view === 'admin' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  <span className="material-icons-round text-sm">desktop_windows</span>
                  แผงควบคุม
                </button>
              </div>
            </div>
          </nav>

          {/* Main Content */}
          <main className="flex-1 px-4 pb-12">
            {view === 'customer' ? (
              <CustomerView currentQueue={currentQueue} />
            ) : (
              <AdminView currentQueue={currentQueue} tickets={tickets} />
            )}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
