<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-System ระบบจองคิวอัจฉริยะ (Pro Max)</title>

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
          animation: { 
            'fade-in': 'fadeIn 0.4s ease-out forwards',
            'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-slow': 'bounce 2s infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <!-- Firebase v10 Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); color: #1e293b; min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); }
    .btn-scale:active { transform: scale(0.97); }
    .text-glow { text-shadow: 0 0 20px rgba(253, 224, 71, 0.5); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. Firebase Initialization
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyB1vBRTD1namUalMXFB7cPhWwdZFONZ-yI",
      authDomain: "q-dee-v-1.firebaseapp.com",
      projectId: "q-dee-v-1",
      storageBucket: "q-dee-v-1.firebasestorage.app",
      messagingSenderId: "735028566995",
      appId: "1:735028566995:web:ee102df3aa20dc69042d26",
      measurementId: "G-LX6G6VEWQW"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // 2. Components
    // ==========================================

    /* 📱 2.1 หน้าลูกค้า (Kiosk & Tracking - แจ้งเตือนแบบ Popup Modal) */
    const CustomerView = ({ displayStatus, allWaitingTickets }) => {
      const [step, setStep] = useState(1);
      const [categories, setCategories] = useState([]);
      const [selectedCat, setSelectedCat] = useState(null);
      const [name, setName] = useState("");
      const [loading, setLoading] = useState(false);
      const [myTicketId, setMyTicketId] = useState(null);
      const [myTicketData, setMyTicketData] = useState(null);
      const [showAlert, setShowAlert] = useState(false); // State ควบคุมการแสดง Popup

      useEffect(() => {
        return db.collection('categories').onSnapshot(snapshot => {
          setCategories(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
      }, []);

      useEffect(() => {
        if (!myTicketId) return;
        return db.collection('tickets').doc(myTicketId).onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data();
            setMyTicketData(data);
            
            // เมื่อสถานะเปลี่ยนเป็น called ให้เปิด Popup แจ้งเตือน
            if (data.status === 'called') {
              setShowAlert(true);
              if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }
          }
        });
      }, [myTicketId]);

      const handleSelectCategory = (cat) => {
        setSelectedCat(cat);
        setStep(2);
      };

      const handleReserve = async (e) => {
        e.preventDefault();
        if (!name.trim()) return alert("กรุณาระบุชื่อของคุณ");
        setLoading(true);

        try {
          const snapshot = await db.collection('tickets').where('category', '==', selectedCat.id).get();
          let maxInt = 0;
          snapshot.forEach(doc => {
            const data = doc.data();
            if (data.queueNumberInt > maxInt) maxInt = data.queueNumberInt;
          });
          
          const newInt = maxInt + 1;
          const qString = selectedCat.id + ("000" + newInt).slice(-3);
          const createdAt = Date.now();

          const docRef = await db.collection('tickets').add({
            name: name.trim(),
            category: selectedCat.id,
            categoryName: selectedCat.name,
            queueNumberInt: newInt,
            queueString: qString,
            status: "waiting",
            createdAt: createdAt,
            calledAt: 0
          });

          setMyTicketId(docRef.id);
          setName("");
          setStep(3);
        } catch (error) {
          alert("เกิดข้อผิดพลาดในการจองคิว โปรดตรวจสอบ Rules ใน Firebase");
        } finally {
          setLoading(false);
        }
      };

      let queuesAhead = 0;
      if (myTicketData && selectedCat) {
        queuesAhead = allWaitingTickets.filter(t => t.category === selectedCat.id && t.createdAt < myTicketData.createdAt).length;
      }

      const formatTime = (timestamp) => {
        if (!timestamp) return "";
        const date = new Date(timestamp);
        return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
      };

      const formatDate = (timestamp) => {
        if (!timestamp) return "";
        const date = new Date(timestamp);
        return date.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      };

      return (
        <div className="animate-fade-in w-full max-w-md mx-auto pt-10 pb-10">
          <div className="glass-card p-10 rounded-[2rem] text-center relative">
            
            {step === 1 && (
              <div className="animate-fade-in">
                <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="material-icons-round text-3xl">touch_app</span>
                </div>
                <h1 className="text-3xl font-bold text-slate-800 mb-2">ยินดีต้อนรับ</h1>
                <p className="text-slate-500 mb-8 font-light">กรุณาเลือกบริการที่ต้องการ</p>
                {categories.length === 0 ? (
                  <p className="text-slate-400 py-6">ยังไม่มีหมวดหมู่บริการในระบบ โปรดให้ผู้ดูแลเพิ่มบริการที่หลังบ้าน</p>
                ) : (
                  <div className="space-y-4">
                    {categories.map(cat => (
                      <button key={cat.id} onClick={() => handleSelectCategory(cat)} className={`btn-scale w-full bg-gradient-to-r ${cat.style || 'from-indigo-500 to-blue-600'} text-white text-xl font-semibold py-5 rounded-2xl flex items-center justify-between px-6 shadow-lg`}>
                        <div className="flex items-center gap-4"><span className="bg-white/20 px-3 py-1 rounded-lg text-2xl">{cat.id}</span> {cat.name}</div>
                        <span className="material-icons-round opacity-70">chevron_right</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            )}

            {step === 2 && (
              <div className="animate-fade-in">
                <button onClick={() => setStep(1)} className="text-slate-400 hover:text-slate-600 mb-6 flex items-center gap-1 font-medium"><span className="material-icons-round text-sm">arrow_back</span> ย้อนกลับ</button>
                <h2 className="text-2xl font-bold text-slate-800 mb-2">ระบุชื่อของคุณ</h2>
                <p className="text-slate-500 mb-6 text-sm">แผนก: <span className="font-semibold text-indigo-600">{selectedCat && selectedCat.name}</span></p>
                <form onSubmit={handleReserve} className="space-y-4">
                  <input type="text" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น..." className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-lg bg-slate-50 outline-none" value={name} onChange={(e) => setName(e.target.value)} disabled={loading} autoFocus />
                  <button type="submit" disabled={loading} className="btn-scale w-full bg-slate-800 text-white font-semibold py-4 rounded-2xl text-xl hover:bg-slate-900 transition flex justify-center items-center gap-2 shadow-xl">
                    {loading ? <span className="material-icons-round animate-spin">refresh</span> : <span className="material-icons-round">how_to_reg</span>}
                    ยืนยันรับคิว
                  </button>
                </form>
              </div>
            )}

            {step === 3 && myTicketData && (
              <div className="animate-fade-in">
                <div className="bg-gradient-to-br from-indigo-50 to-blue-50 rounded-[1.5rem] p-6 mb-6 border border-indigo-100 shadow-inner">
                  <p className="text-indigo-400 font-medium mb-1">หมายเลขคิวของคุณ</p>
                  <div className="text-7xl font-bold text-indigo-600 my-3 tracking-tighter">{myTicketData.queueString}</div>
                  <p className="text-sm font-semibold text-slate-600 bg-white inline-block px-4 py-1.5 rounded-full shadow-sm mb-3">{myTicketData.categoryName}</p>
                  
                  <div className="text-xs text-slate-400 flex items-center justify-center gap-1 border-t border-indigo-100 pt-3">
                    <span className="material-icons-round text-sm">schedule</span>
                    <span>กดรับคิวเมื่อ: {formatDate(myTicketData.createdAt)} เวลา {formatTime(myTicketData.createdAt)}</span>
                  </div>
                </div>
                
                <div className="border border-slate-100 rounded-2xl p-5 text-left space-y-4 bg-white">
                  <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                    <span className="text-slate-500 font-medium flex items-center gap-2">
                      <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse-fast"></div>กำลังเรียก (รวม)
                    </span>
                    <span className="text-2xl font-bold text-slate-800">{displayStatus.currentQueue}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-slate-500 font-medium">คิวของคุณรออีก</span>
                    <span className="text-2xl font-bold text-rose-500 bg-rose-50 px-3 py-1 rounded-lg">{queuesAhead} คิว</span>
                  </div>
                </div>
                
                <p className="text-xs text-slate-400 mt-6">* คุณสามารถเปิดหน้านี้ทิ้งไว้เพื่อดูคิวแบบเรียลไทม์</p>
                <button onClick={() => { setMyTicketId(null); setMyTicketData(null); setShowAlert(false); setStep(1); }} className="mt-4 text-sm text-indigo-500 font-medium hover:underline">← กลับหน้าแรกเพื่อรับคิวใหม่</button>
              </div>
            )}

            {/* Popup Modal แจ้งเตือนเมื่อถึงคิว */}
            {showAlert && (
              <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in">
                <div className="bg-white rounded-[2rem] p-8 max-w-sm w-full text-center shadow-2xl border border-slate-100">
                  <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                    <span className="material-icons-round text-4xl">campaign</span>
                  </div>
                  <h2 className="text-3xl font-bold text-slate-800 mb-2">ถึงคิวของคุณแล้ว!</h2>
                  <div className="text-6xl font-extrabold text-indigo-600 my-3">{myTicketData?.queueString}</div>
                  <p className="text-lg font-semibold text-slate-700 bg-emerald-50 py-3 rounded-xl mb-6 text-emerald-700">
                    เชิญที่ช่องบริการที่ <span className="text-2xl font-black">{displayStatus.counter || 1}</span>
                  </p>
                  <button onClick={() => setShowAlert(false)} className="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl hover:bg-slate-900 transition shadow-lg">
                    รับทราบ
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    /* 💻 2.2 หน้าแผงควบคุม (Admin / Staff View) */
    const AdminView = ({ displayStatus, waitingTickets, calledTickets }) => {
      const [counter, setCounter] = useState("1");
      const [showQRModal, setShowQRModal] = useState(false);

      const manageQueue = async (action, ticket) => {
        try {
          const batch = db.batch();
          if (action === 'CALL' || action === 'RECALL') {
            if (action === 'CALL') {
              batch.update(db.collection('tickets').doc(ticket.id), { status: "called", calledAt: Date.now() });
            }
            batch.set(db.collection('store_status').doc('display'), {
              currentQueue: ticket.queueString,
              counter: counter,
              lastTrigger: Date.now()
            }, { merge: true });
          } else if (action === 'SKIP') {
            batch.update(db.collection('tickets').doc(ticket.id), { status: "skipped" });
          }
          await batch.commit();
        } catch (error) {
          alert("เกิดข้อผิดพลาดในการดำเนินการ");
        }
      };

      const handleCallNext = () => {
        if (waitingTickets.length > 0) manageQueue('CALL', waitingTickets[0]);
        else alert("ไม่มีคิวรอในขณะนี้");
      };

      return (
        <div className="animate-fade-in w-full max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 pt-6 pb-12">
          
          <div className="flex-1 space-y-6">
            <div className="glass-card p-6 rounded-[2rem]">
              <div className="flex justify-between items-center mb-6">
                <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><span className="material-icons-round text-indigo-500">dashboard</span> แผงควบคุม</h1>
                <div className="bg-slate-100 px-4 py-2 rounded-xl flex items-center gap-2 border border-slate-200">
                  <label className="text-sm font-semibold text-slate-500">ประจำช่อง:</label>
                  <select className="bg-transparent font-bold text-indigo-600 outline-none text-lg" value={counter} onChange={e => setCounter(e.target.value)}>
                    {[1,2,3,4,5].map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4 mb-6">
                <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm text-center">
                  <p className="text-sm text-slate-400 font-medium">เรียกล่าสุด</p>
                  <div className="text-4xl font-bold text-slate-800 mt-1">{displayStatus.currentQueue}</div>
                </div>
                <div className="bg-indigo-50 p-5 rounded-2xl border border-indigo-100 shadow-sm text-center">
                  <p className="text-sm text-indigo-500 font-medium">รอรับบริการ</p>
                  <div className="text-4xl font-bold text-indigo-600 mt-1">{waitingTickets.length}</div>
                </div>
              </div>

              <button onClick={handleCallNext} className="btn-scale w-full bg-indigo-600 text-white font-bold text-xl py-4 rounded-2xl shadow-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2 mb-4">
                <span className="material-icons-round">campaign</span> เรียกคิวถัดไปตามลำดับ
              </button>

              <button onClick={() => setShowQRModal(true)} className="w-full bg-slate-50 text-slate-600 font-medium py-3 rounded-xl border border-slate-200 hover:bg-slate-100 transition flex items-center justify-center gap-2">
                <span className="material-icons-round">qr_code</span> สร้าง QR Code ให้ลูกค้า
              </button>
            </div>

            <div className="glass-card p-6 rounded-[2rem]">
              <h2 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="material-icons-round text-orange-400">history</span> ประวัติการเรียก (10 คิวล่าสุด)</h2>
              <div className="space-y-3 max-h-60 overflow-y-auto no-scrollbar">
                {calledTickets.length === 0 && <p className="text-slate-400 text-sm text-center">ยังไม่มีประวัติ</p>}
                {calledTickets.map(t => (
                  <div key={t.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span className="font-bold text-slate-700">{t.queueString} <span className="text-sm font-normal text-slate-400 ml-2">({t.name})</span></span>
                    <button onClick={() => manageQueue('RECALL', t)} className="btn-scale bg-orange-100 text-orange-600 px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-orange-200">เรียกซ้ำ</button>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="flex-1 glass-card p-6 rounded-[2rem] flex flex-col h-[700px]">
            <h2 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><span className="material-icons-round text-emerald-500">list_alt</span> รายการคิวรอทั้งหมด</h2>
            <div className="flex-1 overflow-y-auto no-scrollbar space-y-3">
              {waitingTickets.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-slate-300">
                  <span className="material-icons-round text-6xl mb-2">check_circle</span>
                  <p>เคลียร์คิวหมดแล้ว</p>
                </div>
              ) : (
                waitingTickets.map(t => (
                  <div key={t.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col gap-3">
                    <div className="flex items-center gap-4">
                      <div className="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-2xl font-bold">{t.queueString}</div>
                      <div>
                        <div className="text-sm text-slate-500 font-medium">หมวด: {t.categoryName}</div>
                        <div className="text-lg font-bold text-slate-800">{t.name}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => manageQueue('CALL', t)} className="btn-scale flex-1 bg-emerald-500 text-white py-2 rounded-xl font-semibold hover:bg-emerald-600 shadow-md">เรียกเจาะจง</button>
                      <button onClick={() => manageQueue('SKIP', t)} className="btn-scale flex-none bg-rose-50 text-rose-600 px-4 py-2 rounded-xl font-semibold hover:bg-rose-100 border border-rose-100">ข้าม</button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {showQRModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] px-4">
              <div className="bg-white p-8 rounded-[2rem] text-center max-w-sm w-full shadow-2xl animate-fade-in border border-slate-100">
                <h2 className="text-2xl font-bold text-slate-800 mb-1">สแกนรับคิวออนไลน์</h2>
                <p className="text-sm text-slate-500 mb-6">ลูกค้าสามารถติดตามคิวผ่านมือถือได้ทันที</p>
                <div className="bg-slate-50 p-4 rounded-2xl inline-block mb-6 border border-slate-100">
                  <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.href.split('?')[0] + '?mode=kiosk')}`} alt="QR Code" className="w-48 h-48 mx-auto mix-blend-multiply" />
                </div>
                <button onClick={() => setShowQRModal(false)} className="btn-scale bg-slate-100 text-slate-700 font-bold px-8 py-4 rounded-xl w-full hover:bg-slate-200">ปิดหน้าต่าง</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* 🛠️ 2.3 หน้าจัดการระบบหลังบ้าน (Manager Panel) */
    const ManagerView = () => {
      const [tickets, setTickets] = useState([]);
      const [categories, setCategories] = useState([]);
      const [newCatId, setNewCatId] = useState("");
      const [newCatName, setNewCatName] = useState("");
      const [tvHeader, setTvHeader] = useState("");

      useEffect(() => {
        const unsubTickets = db.collection('tickets').onSnapshot(snapshot => {
          setTickets(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubCats = db.collection('categories').onSnapshot(snapshot => {
          setCategories(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        db.collection('store_status').doc('display').get().then(doc => {
          if (doc.exists && doc.data().tvHeaderTitle) {
            setTvHeader(doc.data().tvHeaderTitle);
          }
        });

        return () => { unsubTickets(); unsubCats(); };
      }, []);

      const handleEditName = async (ticketId, currentName) => {
        const newName = prompt("แก้ไขชื่อลูกค้า:", currentName);
        if (newName !== null && newName.trim() !== "") {
          await db.collection('tickets').doc(ticketId).update({ name: newName.trim() });
        }
      };

      const handleDeleteTicket = async (ticketId) => {
        if (confirm("ต้องการลบคิวนี้ออกจากระบบใช่หรือไม่?")) {
          await db.collection('tickets').doc(ticketId).delete();
        }
      };

      const handleAddCategory = async (e) => {
        e.preventDefault();
        if (!newCatId || !newCatName) return alert("กรุณากรอกรหัส (เช่น D) และชื่อบริการ");
        await db.collection('categories').doc(newCatId.toUpperCase()).set({
          name: newCatName.trim(),
          style: 'from-indigo-500 to-blue-600'
        });
        setNewCatId(""); setNewCatName("");
      };

      const handleEditCategory = async (catId, currentName) => {
        const updatedName = prompt(`แก้ไขชื่อบริการสำหรับหมวด [${catId}]:`, currentName);
        if (updatedName !== null && updatedName.trim() !== "") {
          await db.collection('categories').doc(catId).update({ name: updatedName.trim() });
        }
      };

      const handleDeleteCategory = async (catId) => {
        if (confirm(`ต้องการลบแผนก [${catId}] ใช่หรือไม่?`)) {
          await db.collection('categories').doc(catId).delete();
        }
      };

      const handleSaveTvHeader = async () => {
        await db.collection('store_status').doc('display').set({
          tvHeaderTitle: tvHeader.trim()
        }, { merge: true });
        alert("บันทึกแถบหัวข้อจอแสดงผล (TV) เรียบร้อยแล้ว!");
      };

      const handleResetQueue = async () => {
        if (confirm("⚠️ คำเตือน: การรีเซ็ตจะล้างข้อมูลคิวทั้งหมดของวันนี้ ต้องการดำเนินการต่อหรือไม่?")) {
          const batch = db.batch();
          const snapshot = await db.collection('tickets').get();
          snapshot.forEach(doc => batch.delete(doc.ref));
          batch.set(db.collection('store_status').doc('display'), { currentQueue: "-", counter: "1", lastTrigger: 0 }, { merge: true });
          await batch.commit();
          alert("ล้างข้อมูลคิวทั้งหมดเรียบร้อยแล้ว!");
        }
      };

      return (
        <div className="animate-fade-in w-full max-w-5xl mx-auto py-10 space-y-8">
          <div className="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100">
            <h1 className="text-3xl font-bold text-slate-800 mb-2 flex items-center gap-3">
              <span className="material-icons-round text-indigo-600">settings</span> ระบบจัดการหลังบ้าน (Manager Panel)
            </h1>
            <p className="text-slate-500">จัดการหมวดหมู่บริการ, แก้ไขแถบหัวข้อทีวี, และจัดการแก้ไข/ลบข้อมูลคิว</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="bg-white p-6 rounded-[2rem] shadow-lg border border-slate-100 flex flex-col">
              <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><span className="material-icons-round text-indigo-500">category</span> จัดการหมวดหมู่บริการ Kiosk</h3>
              <form onSubmit={handleAddCategory} className="flex gap-2 mb-4">
                <input type="text" placeholder="รหัส (เช่น D)" className="w-24 p-3 border border-slate-200 rounded-xl uppercase font-bold outline-none" value={newCatId} onChange={e => setNewCatId(e.target.value)} maxLength={2} />
                <input type="text" placeholder="ชื่อบริการ (เช่น ทันตกรรม)" className="flex-1 p-3 border border-slate-200 rounded-xl outline-none" value={newCatName} onChange={e => setNewCatName(e.target.value)} />
                <button type="submit" className="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold shadow-md hover:bg-indigo-700">เพิ่ม</button>
              </form>
              <div className="flex-1 overflow-y-auto max-h-60 space-y-2">
                {categories.length === 0 ? (
                  <p className="text-slate-400 text-center py-4">ยังไม่มีหมวดหมู่บริการ สามารถเพิ่มด้านบนได้เลย</p>
                ) : (
                  categories.map(cat => (
                    <div key={cat.id} className="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                      <span className="font-bold text-slate-700"><span className="bg-indigo-100 text-indigo-600 px-2 py-1 rounded-lg mr-2">[{cat.id}]</span> {cat.name}</span>
                      <div className="flex gap-3">
                        <button onClick={() => handleEditCategory(cat.id, cat.name)} className="text-amber-600 font-bold text-sm hover:underline">แก้ไข</button>
                        <button onClick={() => handleDeleteCategory(cat.id)} className="text-rose-500 font-bold text-sm hover:underline">ลบ</button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>

            <div className="bg-white p-6 rounded-[2rem] shadow-lg border border-slate-100 flex flex-col justify-between">
              <div>
                <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><span className="material-icons-round text-indigo-500">tv</span> แก้ไขแถบหัวข้อจอทีวี</h3>
                <p className="text-slate-500 text-sm mb-4">ข้อความนี้จะแสดงพาดหัวอยู่ด้านบนสุดของหน้าจอแสดงผลทีวี</p>
                <input type="text" placeholder="เช่น คลินิกสุขภาพชุมชน - ยินดีต้อนรับ" className="w-full p-3.5 border border-slate-200 rounded-xl outline-none mb-4 text-lg" value={tvHeader} onChange={e => setTvHeader(e.target.value)} />
              </div>
              <button onClick={handleSaveTvHeader} className="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-emerald-700 transition">บันทึกข้อความหัวจอทีวี</button>
            </div>
          </div>

          <div className="bg-white p-8 rounded-[2rem] shadow-lg border border-slate-100">
            <div className="flex justify-between items-center mb-6">
              <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2"><span className="material-icons-round text-indigo-500">list_alt</span> จัดการข้อมูลคิวทั้งหมดในระบบ (แก้ไข / ลบ)</h3>
              <button onClick={handleResetQueue} className="bg-rose-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-rose-700 transition flex items-center gap-1">
                <span className="material-icons-round text-sm">delete_sweep</span> รีเซ็ตคิวทั้งหมดวันนี้
              </button>
            </div>

            <div className="space-y-3 max-h-96 overflow-y-auto pr-2">
              {tickets.length === 0 ? (
                <p className="text-center text-slate-400 py-8">ไม่มีข้อมูลคิวในระบบ</p>
              ) : (
                tickets.map(t => (
                  <div key={t.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div>
                      <span className="text-xl font-bold text-indigo-600 mr-3">#{t.queueString}</span>
                      <span className="font-semibold text-slate-700">{t.name}</span>
                      <span className="text-xs ml-3 bg-slate-200 px-2.5 py-1 rounded-full font-medium text-slate-600">สถานะ: {t.status}</span>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => handleEditName(t.id, t.name)} className="bg-amber-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-amber-600">แก้ไขชื่อ</button>
                      <button onClick={() => handleDeleteTicket(t.id)} className="bg-rose-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-rose-600">ลบทิ้ง</button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    };

    /* 📺 2.4 จอแสดงผลทีวี (TV Display) */
    const DisplayView = ({ displayStatus, waitingTickets }) => {
      const [isStarted, setIsStarted] = useState(false);
      const lastPlayedRef = useRef(0);
      const [headerTitle, setHeaderTitle] = useState("ระบบคิวอัตโนมัติ Real-time Q-System");

      useEffect(() => {
        db.collection('store_status').doc('display').onSnapshot(doc => {
          if (doc.exists && doc.data().tvHeaderTitle) {
            setHeaderTitle(doc.data().tvHeaderTitle);
          }
        });
      }, []);

      useEffect(() => {
        if (!isStarted) return;
        if (displayStatus.lastTrigger > lastPlayedRef.current) {
          lastPlayedRef.current = displayStatus.lastTrigger;
          
          const qElem = document.getElementById('tv-queue');
          if(qElem) { qElem.classList.add('scale-110', 'text-yellow-300'); setTimeout(() => qElem.classList.remove('scale-110', 'text-yellow-300'), 1500); }

          const chime = document.getElementById('chime-sound');
          if (chime) {
            chime.currentTime = 0;
            chime.play().catch(e => console.log(e));
          }

          setTimeout(() => {
            if ('speechSynthesis' in window && displayStatus.currentQueue !== "-") {
              window.speechSynthesis.cancel();
              const text = `ขอเชิญหมายเลขคิว ${displayStatus.currentQueue.split('').join(' ')} ที่ช่องบริการที่ ${displayStatus.counter} ค่ะ`;
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'th-TH'; utterance.rate = 0.85; utterance.pitch = 1.1;
              window.speechSynthesis.speak(utterance);
            }
          }, 1500);
        }
      }, [displayStatus.lastTrigger, isStarted]);

      if (!isStarted) {
        return (
          <div className="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
            <button onClick={() => setIsStarted(true)} className="btn-scale bg-white text-indigo-900 px-10 py-6 rounded-3xl text-2xl font-bold shadow-2xl flex flex-col items-center gap-4">
              <div className="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-4xl">▶️</div>
              เริ่มหน้าจอทีวี (เปิดระบบเสียง)
            </button>
          </div>
        );
      }

      return (
        <div className="w-full max-w-[1400px] mx-auto h-[85vh] mt-4 bg-slate-900 rounded-[2.5rem] shadow-2xl flex flex-col overflow-hidden border border-slate-700 animate-fade-in relative">
          
          <div className="w-full bg-indigo-900/80 border-b border-indigo-700/50 py-4 px-8 text-center backdrop-blur-md">
            <h1 className="text-2xl md:text-3xl font-bold text-white tracking-wide">{headerTitle}</h1>
          </div>

          <div className="flex-1 flex overflow-hidden">
            <div className="w-2/3 bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 text-white p-10 flex flex-col justify-center items-center relative overflow-hidden">
              <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-indigo-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div>
              <div className="absolute bottom-0 left-0 w-[400px] h-[400px] bg-blue-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>
              
              <h2 className="text-4xl font-medium mb-2 text-indigo-200 tracking-wide z-10">หมายเลขคิว</h2>
              <div id="tv-queue" className="text-[14rem] font-bold leading-none tracking-tighter my-2 z-10 text-white text-glow transition-all duration-300">
                {displayStatus.currentQueue}
              </div>
              <div className="mt-6 bg-white/10 backdrop-blur-md border border-white/20 px-10 py-4 rounded-full text-4xl font-bold flex items-center gap-4 z-10 shadow-xl">
                ช่องบริการ <span className="text-yellow-400 text-5xl ml-3 font-black">{displayStatus.counter}</span>
              </div>
            </div>

            <div className="w-1/3 bg-slate-50 p-8 flex flex-col border-l border-slate-800">
              <h3 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3 border-b border-slate-200 pb-4">
                <span className="w-3.5 h-3.5 rounded-full bg-indigo-500"></span> คิวรอถัดไป
              </h3>
              <div className="flex-1 overflow-y-auto no-scrollbar space-y-4">
                {waitingTickets.slice(0, 5).map(t => (
                  <div key={t.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center text-4xl font-bold text-slate-700 tracking-wide">
                    {t.queueString}
                  </div>
                ))}
              </div>
            </div>
          </div>

          <audio id="chime-sound" src="https://actions.google.com/sounds/v1/alarms/chime_bell_ding.ogg" preload="auto"></audio>
        </div>
      );
    };

    // ==========================================
    // 3. Main App (Router & Real-time Listeners)
    // ==========================================
    const App = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlMode = urlParams.get('mode');
      const [view, setView] = useState(urlMode || 'admin');

      const [displayStatus, setDisplayStatus] = useState({ currentQueue: "-", counter: "1", lastTrigger: 0 });
      const [waitingTickets, setWaitingTickets] = useState([]);
      const [calledTickets, setCalledTickets] = useState([]);

      useEffect(() => {
        const unsubStore = db.collection('store_status').doc('display').onSnapshot(doc => {
          if (doc.exists) setDisplayStatus(doc.data());
          else db.collection('store_status').doc('display').set({ currentQueue: "-", counter: "1", lastTrigger: 0 });
        });

        const unsubWaiting = db.collection('tickets').where('status', '==', 'waiting').onSnapshot(snapshot => {
          let list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => a.createdAt - b.createdAt);
          setWaitingTickets(list);
        });

        const unsubCalled = db.collection('tickets').where('status', '==', 'called').onSnapshot(snapshot => {
          let list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => b.calledAt - a.calledAt);
          setCalledTickets(list.slice(0, 10)); 
        });

        return () => { unsubStore(); unsubWaiting(); unsubCalled(); };
      }, []);

      const isIsolated = urlMode === 'kiosk' || urlMode === 'tv' || urlMode === 'manager';

      return (
        <div className="flex flex-col min-h-screen">
          {!isIsolated && (
            <div className="w-full flex justify-center pt-6 px-4 z-50">
              <nav className="bg-white/70 backdrop-blur-md shadow-sm border border-white/40 rounded-full p-1.5 flex gap-1">
                <button onClick={() => setView('kiosk')} className={`px-5 py-2.5 rounded-full font-semibold transition-all flex items-center gap-2 ${view === 'kiosk' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}><span className="material-icons-round text-base">touch_app</span> รับคิว</button>
                <button onClick={() => setView('admin')} className={`px-5 py-2.5 rounded-full font-semibold transition-all flex items-center gap-2 ${view === 'admin' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}><span className="material-icons-round text-base">admin_panel_settings</span> แผงพนักงาน</button>
                <button onClick={() => setView('manager')} className={`px-5 py-2.5 rounded-full font-semibold transition-all flex items-center gap-2 ${view === 'manager' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}><span className="material-icons-round text-base">settings</span> จัดการระบบ</button>
                <button onClick={() => setView('tv')} className={`px-5 py-2.5 rounded-full font-semibold transition-all flex items-center gap-2 ${view === 'tv' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}><span className="material-icons-round text-base">tv</span> จอทีวี</button>
              </nav>
            </div>
          )}

          <main className="flex-1 px-4 flex flex-col justify-center">
            {view === 'kiosk' && <CustomerView displayStatus={displayStatus} allWaitingTickets={waitingTickets} />}
            {view === 'admin' && <AdminView displayStatus={displayStatus} waitingTickets={waitingTickets} calledTickets={calledTickets} />}
            {view === 'manager' && <ManagerView />}
            {view === 'tv' && <DisplayView displayStatus={displayStatus} waitingTickets={waitingTickets} />}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
